<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>每日打卡</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#20242e; --line:#272b35;
  --text:#f2f3f5; --sub:#8c92a2; --accent:#ffb020; --green:#4ade80; --red:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.5}
body{padding:0 14px calc(34px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:9;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid transparent}
.h-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.date{font-size:23px;font-weight:800;letter-spacing:.5px}
.wd{font-size:13px;color:var(--sub)}
.theme{font-size:14px;font-weight:700;color:var(--accent);margin-top:3px}
.bar{height:8px;background:#22262f;border-radius:99px;overflow:hidden;margin-top:11px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb020,#ffd166);border-radius:99px;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px 6px;margin-top:13px}
h2{margin:0 0 2px;font-size:14px;font-weight:800;color:var(--accent);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-weight:400;font-size:11.5px;color:var(--sub)}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.row:first-of-type{border-top:none}
.cb{flex:0 0 25px;width:25px;height:25px;border:2px solid #4a5060;border-radius:8px;display:grid;place-items:center;transition:.13s}
.cb i{width:12px;height:6px;border-left:3px solid #0f1115;border-bottom:3px solid #0f1115;
  transform:rotate(-45deg) translate(1px,-2px);opacity:0;display:block}
.row.on .cb{background:var(--accent);border-color:var(--accent)}
.row.on .cb i{opacity:1}
.txt{flex:1;min-width:0}
.t1,.t2{display:block}
.t1{font-size:15px}
.t2{font-size:12px;color:var(--sub);margin-top:2px}
.kcal{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.on .t1{color:#9aa0b0;text-decoration:line-through}
.row.on .t2{color:#6b7180}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.dcell{text-align:center;padding:8px 0 6px;border-radius:12px;background:var(--card2);cursor:pointer;border:1px solid transparent}
.dcell.cur{border-color:var(--accent)}
.dcell .dd{font-size:11px;color:var(--sub)}
.dcell .dn{font-size:15px;font-weight:700;margin-top:1px}
.dcell .dg{height:4px;border-radius:99px;background:#2c3140;margin:6px 8px 0;overflow:hidden}
.dcell .dg>i{display:block;height:100%;background:var(--green);width:0}
.nav{display:flex;gap:8px;margin-top:10px}
.nav button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:9px 0;font-size:13px;font-weight:600;font-family:inherit}
.nav button:disabled{opacity:.35}
.nav button:active{background:#2a303c}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
.wrow input{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:11px 14px;font-size:17px;font-family:inherit;outline:none;font-variant-numeric:tabular-nums}
.wrow input:focus{border-color:var(--accent)}
.wrow .unit{font-size:14px;color:var(--sub)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-bottom:8px}
.stat{background:var(--card2);border-radius:13px;padding:11px 13px}
.stat b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--sub)}
.tip{font-size:12px;color:var(--sub);padding:2px 2px 12px;line-height:1.6}
.tip b{color:#c9a35a;font-weight:600}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:11.5px;color:#5e6472}
.footbtns{display:flex;gap:4px}
.foot button{background:none;border:none;color:#5e6472;font-size:11.5px;font-family:inherit;text-decoration:underline;padding:4px}
.badge{display:inline-block;font-size:11px;background:#3a2f14;color:var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.sync{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px}
.sync summary{list-style:none;cursor:pointer;padding:13px 0;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.sync summary::-webkit-details-marker{display:none}
.sync .dot{width:8px;height:8px;border-radius:99px;background:#4a5060;flex:0 0 8px}
.sync .dot.ok{background:var(--green)}
.sync .dot.busy{background:var(--accent)}
.sync .dot.err{background:var(--red)}
.sync #syncState{font-weight:400;color:var(--sub);font-size:12px;margin-left:auto}
.frow{display:flex;align-items:center;gap:10px;margin:0 0 9px}
.frow label{flex:0 0 76px;font-size:12.5px;color:var(--sub)}
.frow input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;outline:none}
.frow input:focus{border-color:var(--accent)}
.sbtn{display:flex;gap:8px;margin:13px 0 10px}
.sbtn button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px 0;font-size:13px;font-weight:700;font-family:inherit}
.sbtn button:active{background:#2a303c}
.hint{font-size:11px;color:#5e6472;line-height:1.65;margin:0 0 13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="h-top">
      <div>
        <div class="date" id="dateEl">—</div>
        <div class="theme" id="themeEl">—</div>
      </div>
      <div class="wd" id="wdEl">—</div>
    </div>
    <div class="bar"><i id="barEl"></i></div>
    <div class="meta"><span id="progEl">0 / 0</span><span id="pctEl">0%</span></div>
  </header>

  <div id="app"></div>

  <details class="sync" id="syncBox">
    <summary><span class="dot" id="syncDot"></span>云同步<span id="syncState">未配置</span></summary>
    <div class="frow"><label>用户名</label><input id="cUser" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github 用户名"></div>
    <div class="frow"><label>页面仓库</label><input id="cRepo" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="daka"></div>
    <div class="frow"><label>数据仓库</label><input id="cDataRepo" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="留空 = 用上面的仓库"></div>
    <div class="frow"><label>分支</label><input id="cBranch" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="main"></div>
    <div class="frow"><label>文件路径</label><input id="cPath" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="data.json"></div>
    <div class="frow"><label>Token</label><input id="cToken" type="password" autocomplete="off" placeholder="ghp_... 或 github_pat_..."></div>
    <div class="sbtn"><button id="saveCfg">保存并同步</button><button id="pullBtn">立即拉取</button></div>
    <p class="hint">Token 只存在这台设备的浏览器里，不会写进网页。建议用 Fine-grained token，只勾选目标仓库的 Contents: Read and write。<br>数据文件若放在公开仓库，任何人都能读到；介意的话把「数据仓库」填成一个私有仓库，页面仓库保持公开即可。</p>
  </details>

  <div class="foot">
    <span>数据保存在本机浏览器，不上传</span>
    <span class="footbtns">
      <button id="importBtn">导入</button>
      <button id="exportBtn">导出</button>
    </span>
  </div>
  <input id="fileInput" type="file" accept=".json,application/json" hidden>
</div>

<script>
(function () {
  "use strict";

  var KEY = "dsh_daily_v1";

  var MEALS = [
    { id: "m1", t: "早餐", d: "面包 2 片 + 牛奶 250 ml + 水煮蛋 2 个", k: 430 },
    { id: "m2", t: "午餐", d: "食堂：米饭 1 小碗 + 荤 1 掌 + 绿叶菜 2 份", k: 600 },
    { id: "m3", t: "下午", d: "苹果 1 个", k: 100 },
    { id: "m4", t: "晚餐", d: "玉米 1 + 鸡胸 150 g + 番茄 1 + 黄瓜 1", k: 375 },
    { id: "m5", t: "练后", d: "蛋白粉 1 勺（牛奶或水冲）", k: 120 },
    { id: "m6", t: "饮料", d: "橙C美式 1 杯（不加糖浆）", k: 140, opt: true, note: "喝了就勾 · 不计入完成度" }
  ];

  var HABITS = [
    { id: "h1", d: "8000 步" },
    { id: "h2", d: "水 2–2.5 L" },
    { id: "h3", d: "睡 7 h+" }
  ];

  var PLAN = {
    2: { name: "腿 + 肩", note: "组间 90–120 秒", items: [
      { id: "t1", n: "高脚杯深蹲", s: "3 × 8–10", w: "12 kg", tip: "膝随脚尖" },
      { id: "t2", n: "分腿蹲", s: "3 × 8 / 腿", w: "自重 → 4 kg", tip: "后脚点地" },
      { id: "t3", n: "杠铃罗马尼亚硬拉", s: "3 × 8", w: "30 kg", tip: "屈髋不屈腰" },
      { id: "t4", n: "站姿提踵", s: "3 × 15", w: "8 kg", tip: "顶端停 1 秒" },
      { id: "t5", n: "哑铃侧平举", s: "3 × 12–15", w: "3 kg", tip: "抬到肩高" }
    ]},
    4: { name: "胸 + 三头", note: "组间 60–90 秒", items: [
      { id: "t1", n: "哑铃地板卧推", s: "4 × 8", w: "10 kg", tip: "肘约 45°" },
      { id: "t2", n: "俯卧撑", s: "3 × 8–12", w: "自重", tip: "满 12 个再脚垫高" },
      { id: "t3", n: "哑铃飞鸟", s: "3 × 12–15", w: "4 kg", tip: "幅度小" },
      { id: "t4", n: "窄距俯卧撑", s: "3 × 8–10", w: "跪姿起步", tip: "" },
      { id: "t5", n: "哑铃颈后臂屈伸", s: "3 × 10–12", w: "6 kg", tip: "肘尖朝前" },
      { id: "t6", n: "哑铃侧平举", s: "4 × 12–15", w: "3 kg", tip: "" }
    ]},
    6: { name: "背 + 二头", note: "组间 75–90 秒", items: [
      { id: "t1", n: "单臂哑铃划船", s: "3 × 10 / 侧", w: "12 kg", tip: "拉向小腹" },
      { id: "t2", n: "杠铃俯身划船", s: "4 × 8–10", w: "25 kg", tip: "背与地面 45°" },
      { id: "t3", n: "仰卧哑铃上拉", s: "3 × 10–12", w: "10 kg", tip: "感受背阔拉伸" },
      { id: "t4", n: "俯身反向飞鸟", s: "3 × 12–15", w: "3 kg", tip: "后肩" },
      { id: "t5", n: "哑铃弯举", s: "3 × 10–12", w: "6 kg", tip: "肘固定" },
      { id: "t6", n: "卷腹", s: "3 × 15–20", w: "自重", tip: "" }
    ]},
    0: { name: "肩 + 腹", note: "组间 60–90 秒", items: [
      { id: "t1", n: "坐姿哑铃肩推", s: "4 × 8", w: "8 kg", tip: "不塌腰" },
      { id: "t2", n: "哑铃侧平举", s: "5 × 12–15", w: "3 kg", tip: "本日主项" },
      { id: "t3", n: "俯身反向飞鸟", s: "3 × 12–15", w: "2.5 kg", tip: "" },
      { id: "t4", n: "哑铃地板卧推（轻）", s: "3 × 10–12", w: "8 kg", tip: "不追重量" },
      { id: "t5", n: "卷腹", s: "3 × 15–20", w: "自重", tip: "" },
      { id: "t6", n: "平板支撑", s: "2 × 45 秒", w: "自重", tip: "" }
    ]}
  };

  var REST = { name: "休息 / 有氧", note: "周一、三、五", items: [
    { id: "r1", n: "有氧 30 分钟", s: "快走 / 骑车 / 爬楼", w: "", tip: "" },
    { id: "r2", n: "拉伸", s: "10 分钟", w: "", tip: "" }
  ]};

  var WD = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

  var viewDate = new Date();
  var app = document.getElementById("app");

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function sameDay(a, b) { return ymd(a) === ymd(b); }

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function store(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }
  function recOf(s, k) {
    if (!s[k]) s[k] = {};
    if (!s[k].c) s[k].c = {};
    return s[k];
  }

  function planFor(d) {
    var w = d.getDay();
    return PLAN[w] || REST;
  }

  function totalItems(p) {
    var n = p.items.length + HABITS.length, i;
    for (i = 0; i < MEALS.length; i++) if (!MEALS[i].opt) n++;
    return n;
  }
  function doneItems(c, p) {
    var n = 0, i;
    for (i = 0; i < MEALS.length; i++) if (!MEALS[i].opt && c[MEALS[i].id]) n++;
    for (i = 0; i < p.items.length; i++) if (c[p.items[i].id]) n++;
    for (i = 0; i < HABITS.length; i++) if (c[HABITS[i].id]) n++;
    return n;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m];
    });
  }

  function row(id, title, sub, right, on) {
    return '<div class="row' + (on ? " on" : "") + '" data-cb="' + id + '">' +
      '<span class="cb"><i></i></span>' +
      '<span class="txt"><span class="t1">' + title + '</span>' +
      (sub ? '<span class="t2">' + sub + '</span>' : "") + '</span>' +
      (right ? '<span class="kcal">' + right + '</span>' : "") +
      '</div>';
  }

  function render() {
    var s = load();
    var today = new Date();
    var k = ymd(viewDate);
    var rec = recOf(s, k);
    var c = rec.c;
    var plan = planFor(viewDate);
    var total = totalItems(plan);
    var done = doneItems(c, plan);
    var pct = total ? Math.round(done / total * 100) : 0;

    document.getElementById("dateEl").textContent =
      (viewDate.getMonth() + 1) + " 月 " + viewDate.getDate() + " 日" +
      (sameDay(viewDate, today) ? "" : "（补记）");
    document.getElementById("themeEl").textContent = plan.name;
    document.getElementById("wdEl").textContent = WD[viewDate.getDay()];
    document.getElementById("barEl").style.width = pct + "%";
    document.getElementById("progEl").textContent = done + " / " + total + " 项";
    document.getElementById("pctEl").textContent = pct + "%";

    var html = "";

    /* ---- 7 天条带 ---- */
    html += '<section><h2>最近 7 天<small>点日期可补记</small></h2><div class="strip">';
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today.getTime() - i * 86400000);
      var kk = ymd(d);
      var pp = planFor(d);
      var cc = (s[kk] && s[kk].c) || {};
      var tt = totalItems(pp), dd = doneItems(cc, pp);
      var ratio = tt ? Math.round(dd / tt * 100) : 0;
      html += '<div class="dcell' + (sameDay(d, viewDate) ? " cur" : "") + '" data-day="' + kk + '">' +
        '<div class="dd">' + WD[d.getDay()].replace("周", "") + '</div>' +
        '<div class="dn">' + d.getDate() + '</div>' +
        '<div class="dg"><i style="width:' + ratio + '%"></i></div>' +
        '</div>';
    }
    html += '</div><div class="nav">' +
      '<button data-nav="-1">← 前一天</button>' +
      '<button data-nav="1"' + (sameDay(viewDate, today) ? " disabled" : "") + '>后一天 →</button>' +
      '</div></section>';

    /* ---- 饮食 ---- */
    html += '<section><h2>饮食<small>≈1650 kcal · 蛋白 124 g</small></h2>';
    for (var m = 0; m < MEALS.length; m++) {
      var it = MEALS[m];
      html += row(it.id, '<b>' + it.t + '</b>　' + esc(it.d), it.note || "", it.k, !!c[it.id]);
    }
    html += '<div class="tip">咖啡那行只在喝的日子勾，用来统计，不计入完成度。<br>' +
      '纤维只有约 19 g，午餐绿叶菜一定打满两份。</div></section>';

    /* ---- 训练 ---- */
    html += '<section><h2>' + plan.name + '<small>' + plan.note + '</small></h2>';
    for (var t = 0; t < plan.items.length; t++) {
      var ti = plan.items[t];
      var sub = ti.s + (ti.w ? " · " + ti.w : "") + (ti.tip ? " · " + ti.tip : "");
      html += row(ti.id, ti.n, sub, "", !!c[ti.id]);
    }
    html += '<div class="tip">' + (PLAN[viewDate.getDay()]
      ? "所有组做到上限次数 → 下次加重：哑铃 +2 kg、杠铃 +5 kg。"
      : "休息日别加练，走路和拉伸就够。") + '</div></section>';

    /* ---- 习惯 ---- */
    html += '<section><h2>每日习惯<small>三条，别漏</small></h2>';
    for (var h = 0; h < HABITS.length; h++) {
      html += row(HABITS[h].id, HABITS[h].d, "", "", !!c[HABITS[h].id]);
    }
    html += '</section>';

    /* ---- 体重 ---- */
    html += '<section><h2>体重<small>晨起空腹</small></h2>' +
      '<div class="wrow"><input id="wInput" type="number" step="0.1" inputmode="decimal" ' +
      'placeholder="今天多少 kg？" value="' + (rec.w != null ? rec.w : "") + '"><span class="unit">kg</span></div>' +
      '</section>';

    /* ---- 统计 ---- */
    var monthKey = ymd(viewDate).slice(0, 7);
    var days = 0, trains = 0, coffees = 0, wFirst = null, wLast = null, wLastDate = "";
    var keys = Object.keys(s).sort();
    for (var q = 0; q < keys.length; q++) {
      var kx = keys[q];
      if (kx.slice(0, 7) !== monthKey) continue;
      var rc = s[kx];
      var dv = new Date(kx + "T12:00:00");
      var pl = planFor(dv);
      var cn = 0, tot = totalItems(pl);
      var ck = rc.c || {};
      cn = doneItems(ck, pl);
      if (ck.m6) coffees++;
      if (cn > 0) days++;
      if (PLAN[dv.getDay()] && cn >= pl.items.length) trains++;
      if (rc.w != null) { if (wFirst == null) wFirst = rc.w; wLast = rc.w; wLastDate = kx; }
    }
    var gap = wLast != null ? (wLast - 63) : null;
    var nowD = new Date();
    var isCur = ymd(nowD).slice(0, 7) === monthKey;
    var elapsed = isCur ? nowD.getDate() : new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
    var rate = elapsed ? Math.round(days / elapsed * 100) : 0;

    html += '<section><h2>本月<small>' + monthKey.replace("-", " / ") + '</small></h2><div class="stats">' +
      '<div class="stat"><b>' + days + '</b><span>打卡天数</span></div>' +
      '<div class="stat"><b>' + trains + '</b><span>完成训练</span></div>' +
      '<div class="stat"><b>' + coffees + '</b><span>橙C美式 杯</span></div>' +
      '<div class="stat"><b>' + rate + '%</b><span>本月打卡率</span></div>' +
      '<div class="stat"><b>' + (wLast != null ? wLast.toFixed(1) : "—") + '</b><span>最新体重 kg</span></div>' +
      '<div class="stat"><b>' + (gap != null ? (gap > 0 ? "−" : "+") + Math.abs(gap).toFixed(1) : "—") + '</b><span>距 63 kg</span></div>' +
      '</div></section>';

    app.innerHTML = html;
  }

  /* 事件 */
  document.addEventListener("click", function (e) {
    var cb = e.target.closest("[data-cb]");
    if (cb) {
      var s = load();
      var rec = recOf(s, ymd(viewDate));
      var id = cb.getAttribute("data-cb");
      rec.c[id] = !rec.c[id];
      rec.ts = Date.now();
      store(s);
      render();
      schedulePush();
      return;
    }
    var day = e.target.closest("[data-day]");
    if (day) {
      viewDate = new Date(day.getAttribute("data-day") + "T12:00:00");
      render();
      return;
    }
    var nav = e.target.closest("[data-nav]");
    if (nav) {
      var n = parseInt(nav.getAttribute("data-nav"), 10);
      var nd = new Date(viewDate.getTime() + n * 86400000);
      if (nd > new Date()) return;
      viewDate = nd;
      render();
      return;
    }
    if (e.target.id === "exportBtn") {
      var blob = new Blob([JSON.stringify(load(), null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "打卡记录-" + ymd(new Date()) + ".json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      return;
    }
    if (e.target.id === "importBtn") {
      var fi = document.getElementById("fileInput");
      if (fi) fi.click();
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "wInput") {
      var v = parseFloat(e.target.value);
      var s = load();
      var rec = recOf(s, ymd(viewDate));
      if (isFinite(v) && v > 0) { rec.w = Math.round(v * 10) / 10; } else { delete rec.w; }
      rec.ts = Date.now();
      store(s);
      render();
      schedulePush();
    }
  });

  var fileEl = document.getElementById("fileInput");
  if (fileEl) {
    fileEl.addEventListener("change", function () {
      var f = fileEl.files && fileEl.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var data = null;
        try { data = JSON.parse(String(reader.result)); } catch (err) { data = null; }
        if (!data || typeof data !== "object") {
          alert("这个文件读不出来，确认是「导出」生成的 JSON 吗？");
          fileEl.value = "";
          return;
        }
        var s = load();
        var newChecks = 0, days = 0;
        Object.keys(data).forEach(function (k) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
          var src = data[k] || {};
          var dst = s[k] || (s[k] = {});
          dst.c = dst.c || {};
          var sc = src.c || {};
          Object.keys(sc).forEach(function (id) {
            if (sc[id] && !dst.c[id]) { dst.c[id] = true; newChecks++; }
          });
          if (src.w != null && dst.w == null) dst.w = src.w;
          days++;
        });
        store(s);
        render();
        alert("已合并 " + days + " 天记录，新增 " + newChecks + " 个勾选。");
        fileEl.value = "";
      };
      reader.readAsText(f);
    });
  }

  /* ---------------- 云同步（GitHub 仓库当数据库） ---------------- */
  var CFG_KEY = "dsh_sync_cfg_v2";
  var cfg = (function () {
    try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) { return {}; }
  })();
  var syncTimer = null, busy = false;

  function cfgOk() { return !!(cfg.user && cfg.repo && cfg.branch && cfg.path && cfg.token); }
  function dataRepo() { return cfg.dataRepo || cfg.repo; }
  function apiUrl() {
    return "https://api.github.com/repos/" + encodeURIComponent(cfg.user) + "/" +
      encodeURIComponent(dataRepo()) + "/contents/" + encodeURIComponent(cfg.path);
  }
  function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
  function b64dec(s) { return decodeURIComponent(escape(atob(String(s).replace(/\s/g, "")))); }
  function hhmm() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function setState(txt, kind) {
    var st = document.getElementById("syncState");
    var dot = document.getElementById("syncDot");
    if (st) st.textContent = txt;
    if (dot) dot.className = "dot" + (kind ? " " + kind : "");
  }

  function stable(o) {
    if (o === null || typeof o !== "object") return JSON.stringify(o);
    if (Array.isArray(o)) return "[" + o.map(stable).join(",") + "]";
    return "{" + Object.keys(o).sort().map(function (k) {
      return JSON.stringify(k) + ":" + stable(o[k]);
    }).join(",") + "}";
  }

  function mergeRec(x, y) {
    if (!x) return y;
    if (!y) return x;
    var tx = x.ts || 0, ty = y.ts || 0;
    if (tx > ty) return x;
    if (ty > tx) return y;
    var c = {}, cx = x.c || {}, cy = y.c || {};
    Object.keys(cx).concat(Object.keys(cy)).forEach(function (id) {
      if (cx[id] || cy[id]) c[id] = true;
    });
    var r = { c: c };
    var w = (x.w != null) ? x.w : y.w;
    if (w != null) r.w = w;
    if (tx) r.ts = tx;
    return r;
  }

  function mergeStates(a, b) {
    var keys = {}, out = {};
    Object.keys(a || {}).forEach(function (k) { keys[k] = 1; });
    Object.keys(b || {}).forEach(function (k) { keys[k] = 1; });
    Object.keys(keys).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      out[k] = mergeRec((a || {})[k], (b || {})[k]);
    });
    return out;
  }

  function apiErr(r) {
    if (r.status === 401) return "401 Token 无效或已过期，重新生成一个";
    if (r.status === 403) return "403 没有写权限：Contents 要设成 Read and write";
    if (r.status === 404) return "404 仓库或路径不对，或 Token 没勾选这个仓库";
    if (r.status === 409) return "409 文件冲突，再点一次同步";
    return "HTTP " + r.status;
  }

  async function ghGet() {
    var r = await fetch(apiUrl() + "?ref=" + encodeURIComponent(cfg.branch) + "&_=" + Date.now(), {
      headers: { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json" },
      cache: "no-store"
    });
    if (r.status === 404) return { sha: null, data: {} };
    if (!r.ok) throw new Error(apiErr(r));
    var j = await r.json();
    var data = {};
    try { data = JSON.parse(b64dec(j.content || "")) || {}; } catch (e) { data = {}; }
    return { sha: j.sha, data: data };
  }

  async function ghPut(sha, data) {
    var body = {
      message: "sync " + new Date().toISOString(),
      content: b64enc(JSON.stringify(data, null, 2)),
      branch: cfg.branch
    };
    if (sha) body.sha = sha;
    var r = await fetch(apiUrl(), {
      method: "PUT",
      headers: {
        Authorization: "Bearer " + cfg.token,
        Accept: "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(apiErr(r));
    return r.json();
  }

  async function pullRemote() {
    if (!cfgOk()) { setState("未配置", ""); return; }
    if (busy) return;
    busy = true; setState("同步中…", "busy");
    try {
      var g = await ghGet();
      var local = load();
      var merged = mergeStates(local, g.data);
      if (stable(merged) !== stable(local)) { store(merged); render(); }
      setState("已同步 " + hhmm(), "ok");
    } catch (e) {
      setState("拉取失败：" + (e && e.message ? e.message : "网络错误"), "err");
    } finally { busy = false; }
  }

  async function pushRemote() {
    if (!cfgOk()) return;
    if (busy) { schedulePush(); return; }
    busy = true; setState("上传中…", "busy");
    try {
      var g = await ghGet();
      var merged = mergeStates(load(), g.data);
      store(merged);
      await ghPut(g.sha, merged);
      render();
      setState("已同步 " + hhmm(), "ok");
    } catch (e) {
      setState("上传失败：" + (e && e.message ? e.message : "网络错误"), "err");
    } finally { busy = false; }
  }

  function schedulePush() {
    if (!cfgOk()) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(pushRemote, 1500);
  }

  (function initSyncUI() {
    var userEl = document.getElementById("cUser");
    if (!userEl) return;
    var map = { user: "cUser", repo: "cRepo", dataRepo: "cDataRepo", branch: "cBranch", path: "cPath", token: "cToken" };
    Object.keys(map).forEach(function (k) {
      var el = document.getElementById(map[k]);
      if (el && cfg[k] != null) el.value = cfg[k];
    });
    if (!document.getElementById("cBranch").value) document.getElementById("cBranch").value = "main";
    if (!document.getElementById("cPath").value) document.getElementById("cPath").value = "data.json";

    document.getElementById("saveCfg").addEventListener("click", function () {
      var next = {
        user: document.getElementById("cUser").value.trim(),
        repo: document.getElementById("cRepo").value.trim(),
        dataRepo: document.getElementById("cDataRepo").value.trim(),
        branch: document.getElementById("cBranch").value.trim() || "main",
        path: document.getElementById("cPath").value.trim() || "data.json",
        token: document.getElementById("cToken").value.trim()
      };
      if (!next.user || !next.repo || !next.token) {
        setState("用户名 / 仓库 / Token 都要填", "err");
        return;
      }
      cfg = next;
      try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
      setState("配置已保存，同步中…", "busy");
      pullRemote().then(function () { return pushRemote(); });
    });

    document.getElementById("pullBtn").addEventListener("click", function () { pullRemote(); });

    if (cfgOk()) pullRemote(); else setState("未配置", "");
  })();

  render();
})();
</script>
</body>
</html>
